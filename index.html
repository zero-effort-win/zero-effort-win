<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CMD-PRO personal profile and links."
  >

  <title>CMD-PRO</title>

  <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>
  <main class="profile-card">

<div class="avatar" aria-label="CMD-PRO profile icon">
  <svg
    class="terminal-mark"
    viewBox="0 0 64 64"
    aria-hidden="true"
  >
    <path
      d="M17 21 L31 32 L17 43"
      fill="none"
      stroke="currentColor"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M35 43 H49"
      fill="none"
      stroke="currentColor"
      stroke-width="4.5"
      stroke-linecap="round"
    />
  </svg>
</div>

    <p class="status">
      <span class="status-dot"></span>
      System online
    </p>

    <h1>CMD-PRO</h1>

    <p class="username">@cmd-pro</p>

    <p class="bio">
      Tech enthusiast exploring software, systems and the internet.
    </p>

    <p class="location">
      ◉ Sector 0x7F · The Network
    </p>

    <nav class="links" aria-label="Profile links">

      <a
        class="profile-link"
        href="./blog.html"
      >
        <span>Blog</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="profile-link"
        href="https://steamcommunity.com/id/noone974/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Steam</span>
        <span class="arrow">↗</span>
      </a>

      <a
        class="profile-link"
        href="https://discord.com/users/1454042455816274088"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Discord</span>
        <span class="arrow">↗</span>
      </a>

      <a
        class="profile-link"
        href="mailto:contacto@cmd-pro.win"
      >
        <span>Contact</span>
        <span class="arrow">→</span>
      </a>

    </nav>

    <footer>
      <span>cmd-pro.win</span>
      <span>© 2026</span>
    </footer>

  </main>
</body>
</html>
