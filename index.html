<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Site Under Construction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #05070a;
      color: #e7fff4;

      font-family: monospace;
    }

    main {
      text-align: center;
    }

    .status {
      margin-bottom: 18px;

      color: #35ff9a;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(2rem, 8vw, 4rem);
      letter-spacing: 3px;
    }

    p {
      margin-top: 18px;

      color: #83968d;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main>
    <div class="status">● OFFLINE</div>

    <h1>SITE UNDER CONSTRUCTION</h1>

    <p>Check back later.</p>
  </main>
</body>
</html>
