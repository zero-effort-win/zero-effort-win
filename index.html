<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CMD-PRO personal profile and links."
  >

  <title>CMD-PRO</title>

  <link rel="stylesheet" href="./style.css?v=8">
  <link rel="stylesheet" href="./avatar.css?v=1">
</head>

<body>
  <main class="profile-card">

<div
  class="avatar terminal-avatar terminal-avatar--hero"
  aria-label="CMD-PRO terminal profile icon"
>
  <svg
    class="terminal-mark"
    viewBox="0 0 64 64"
    aria-hidden="true"
  >
    <g
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M15 20 L30 32 L15 44" />
      <path d="M38 44 H55" />
    </g>
  </svg>
</div>

    <p class="status">
      <span class="status-dot"></span>
      System online
    </p>

    <h1>CMD-PRO</h1>

    <p class="username">@cmd-pro</p>

    <p class="bio">
      Interested in software, computer systems and how the internet works.
    </p>

    <p class="location">
      ◉ Sector 0x7F · The Network
    </p>

    <nav class="links" aria-label="Profile links">

      <a
        class="profile-link"
        href="./blog.html"
      >
        <span>Blog</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="profile-link"
        href="https://steamcommunity.com/id/noone974/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Steam</span>
        <span class="arrow">↗</span>
      </a>

      <a
        class="profile-link"
        href="https://discord.com/users/1454042455816274088"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Discord</span>
        <span class="arrow">↗</span>
      </a>

      <a
        class="profile-link"
        href="mailto:contacto@cmd-pro.win"
      >
        <span>Contact</span>
        <span class="arrow">→</span>
      </a>

    </nav>

    <footer>
      <span>cmd-pro.win</span>
      <span>© 2026</span>
    </footer>

  </main>
</body>
</html>
