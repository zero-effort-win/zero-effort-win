<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="CMD-PRO personal profile and links."
  >

  <title>CMD-PRO</title>

  <link rel="stylesheet" href="./style.css?v=3">
</head>

<body>
  <main class="profile-card">

    <div class="avatar" aria-label="CMD-PRO profile icon">
      C-P
    </div>

    <p class="status">
      <span class="status-dot"></span>
      System online
    </p>

    <h1>CMD-PRO</h1>

    <p class="username">@cmd-pro</p>

    <p class="bio">
      Exploring technology, software, and the
      hidden layers of the internet.
    </p>

    <p class="location">
      ◉ Sector 0x7F · The Network
    </p>

    <nav class="links" aria-label="Profile links">

      <a
        class="profile-link"
        href="https://github.com/YOUR-USERNAME"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>GitHub</span>
        <span class="arrow">↗</span>
      </a>

      <a
        class="profile-link"
        href="https://steamcommunity.com/id/YOUR-USERNAME"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Steam</span>
        <span class="arrow">↗</span>
      </a>

      <a
        class="profile-link"
        href="#"
      >
        <span>Projects</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="profile-link"
        href="#"
      >
        <span>Contact</span>
        <span class="arrow">→</span>
      </a>

    </nav>

    <footer>
      <span>cmd-pro.win</span>
      <span>© 2026</span>
    </footer>

  </main>
</body>
</html>
