<!DOCTYPE html>
<html lang="es">

<head>
  <meta name="theme-color" content="#05070a">
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=4" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">


  <title>Sitio no disponible</title>

  <style>
    :root {
      --background: #05070a;
      --surface: rgba(7, 13, 10, 0.68);
      --surface-strong: rgba(7, 13, 10, 0.82);

      --text: #e7fff4;
      --muted: #83968d;

      --accent: #35ff9a;
      --border: rgba(53, 255, 154, 0.20);

      --offline: #ff4d4d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;

      color-scheme: dark;

      background:
        linear-gradient(
          rgba(53, 255, 154, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(53, 255, 154, 0.025) 1px,
          transparent 1px
        ),
        radial-gradient(
          circle at 50% 0%,
          #123024 0%,
          #0b1912 24%,
          #05070a 58%
        );

      background-size:
        32px 32px,
        32px 32px,
        auto;

      background-attachment: fixed;
    }

    body {
      min-height: 100dvh;
      margin: 0;

      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--text);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

      background: transparent;
    }


    /* =========================
       TERMINAL WINDOW
       ========================= */

    .terminal {
      width: 100%;
      max-width: 650px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(12, 22, 17, 0.76),
          rgba(5, 9, 7, 0.72)
        );

      border: 1px solid var(--border);
      border-radius: 10px;

      box-shadow:
        0 26px 90px rgba(0, 0, 0, 0.48),
        0 0 55px rgba(53, 255, 154, 0.055);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }


    /* =========================
       TERMINAL TITLE BAR
       ========================= */

    .terminal-bar {
      min-height: 42px;

      padding: 0 14px;

      display: flex;
      align-items: center;

      background: rgba(3, 7, 5, 0.55);

      border-bottom: 1px solid rgba(53, 255, 154, 0.12);
    }

    .terminal-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

.control {
  width: 10px;
  height: 10px;

  border-radius: 50%;
}

.control:nth-child(1) {
  background: #ff5f57;
}

.control:nth-child(2) {
  background: #febc2e;
}

.control:nth-child(3) {
  background: #28c840;
}

    .terminal-title {
      position: absolute;
      left: 50%;

      transform: translateX(-50%);

      color: #617069;

      font-size: 0.66rem;

      letter-spacing: 1px;
    }


    /* =========================
       TERMINAL CONTENT
       ========================= */

    .terminal-body {
      padding: 34px 36px 38px;
    }

.status {
  margin-bottom: 32px;

  display: flex;
  align-items: center;

  color: var(--muted);

  font-size: 0.72rem;
  letter-spacing: 1.5px;
}

    .prompt {
      margin: 0 0 16px;

      color: var(--accent);

      font-size: 0.84rem;
    }

    .prompt::before {
      content: "> ";
    }

    h1 {
      margin: 0 0 22px;

      color: var(--text);

      font-family: inherit;
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: 700;

      line-height: 1.15;

      letter-spacing: 1px;
    }

    .message {
      max-width: 520px;
      margin: 0;

      color: var(--muted);

      font-size: 0.95rem;
      line-height: 1.75;
    }


    /* =========================
       CURSOR
       ========================= */

    .cursor-tail {
      white-space: nowrap;
    }

    .cursor {
      width: 7px;
      height: 1em;

      margin-left: 5px;

      display: inline-block;

      vertical-align: -2px;

      background: var(--accent);

      box-shadow:
        0 0 7px rgba(53, 255, 154, 0.4);

      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }


    /* =========================
       EMAIL
       ========================= */

    .email {
      width: fit-content;

      margin-top: 44px;

      display: inline-block;

      color: var(--accent);

      font-size: 0.76rem;

      text-decoration: none;
      letter-spacing: 0.8px;

      text-shadow:
        0 0 8px rgba(53, 255, 154, 0.28);
    }

    .email::before {
      content: "> ";
      color: var(--muted);
    }

@media (hover: hover) and (pointer: fine) {
  .email:hover {
    text-decoration: underline;
  }
}


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 520px) {

      body {
        align-items: center;
      }

      .terminal {
        border-radius: 8px;
      }

      .terminal-bar {
        min-height: 38px;
        padding: 0 12px;
      }

      .control {
        width: 8px;
        height: 8px;
      }

      .terminal-title {
        font-size: 0.59rem;
      }

      .terminal-body {
        padding: 27px 22px 30px;
      }

      .status {
        margin-bottom: 28px;

        font-size: 0.67rem;
      }

      h1 {
        font-size: 1.75rem;

        line-height: 1.22;

        letter-spacing: 0.5px;
      }

      .message {
        font-size: 0.88rem;
        line-height: 1.7;
      }

      .email {
        margin-top: 38px;
        font-size: inherit;
      }
    }


 @media (max-width: 350px) {
  h1 {
    font-size: 1.55rem;
  }
}

      h1 {
        font-size: 1.55rem;
      }
    }

.contact-line {
  margin-top: 44px;
  font-size: 0.76rem;
}

.contact-prompt {
  color: var(--muted);
  margin-right: 6px;
  font-size: inherit;
}

.contact-label {
  color: var(--muted);
  margin-right: 6px;
  font-size: inherit;
}

  </style>
</head>


<body>

  <main class="terminal">

    <div class="terminal-bar">

      <div class="terminal-controls">
        <span class="control"></span>
        <span class="control"></span>
        <span class="control"></span>
      </div>

      <span class="terminal-title">
        SISTEMA — OFFLINE
      </span>

    </div>


    <div class="terminal-body">

<div class="status">
  <span>CMD-PRO</span>
</div>

      
      <div class="prompt">
        Estado
      </div>


      <h1>
        SITIO NO DISPONIBLE
      </h1>


      <p class="message">
        Este sector de la red está temporalmente no
        <span class="cursor-tail">disponible.<span class="cursor"></span></span>
      </p>


  <div class="contact-line">
  <span class="contact-prompt">&gt;</span>
  <span class="contact-label">Correo de contacto:</span>
  <a class="email" href="mailto:cmdavid@cmd-pro.win"cmdavid@cmd-pro.win</a>
  </div>

    </div>

  </main>

</body>

</html>
