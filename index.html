<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
  <meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

  <title>Sitio no disponible</title>

  <style>
    :root {
      --background: #05070a;
      --text: #e7fff4;
      --muted: #83968d;
      --accent: #35ff9a;
      --border: rgba(53, 255, 154, 0.18);
    }

    * {
      box-sizing: border-box;
    }

html {
  min-height: 100%;
  color-scheme: dark;

  background:
    linear-gradient(
      rgba(53, 255, 154, 0.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(53, 255, 154, 0.025) 1px,
      transparent 1px
    ),
    radial-gradient(
      circle at top,
      #10251c 0%,
      #05070a 48%
    );

  background-size:
    32px 32px,
    32px 32px,
    auto;
}

    body {
      min-height: 100dvh;
      margin: 0;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--text);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .terminal {
      width: 100%;
      max-width: 620px;

      padding: 34px;

      background: rgba(10, 16, 22, 0.88);

      border: 1px solid var(--border);
      border-radius: 16px;

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(53, 255, 154, 0.05);
    }

    .status {
      margin-bottom: 26px;

      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--muted);

      font-size: 0.75rem;
      letter-spacing: 1.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      background: #ff4d4d;

      border-radius: 50%;

      box-shadow:
        0 0 12px rgba(255, 77, 77, 0.8);
    }

    .prompt {
      margin-bottom: 14px;

      color: var(--accent);

      font-size: 0.85rem;
    }

    h1 {
      margin: 0 0 18px;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      font-size: clamp(2rem, 7vw, 3.4rem);

      letter-spacing: 2px;
    }

    p {
      margin: 0;

      color: var(--muted);

      line-height: 1.7;
    }

    .cursor {
      display: inline-block;

      width: 8px;
      height: 1em;

      margin-left: 5px;

      vertical-align: -2px;

      background: var(--accent);

      animation: blink 1s steps(1) infinite;
    }

    .cursor-tail {
  white-space: nowrap;
}

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

.email {
  display: inline-block;
  margin-top: 48px;

  color: var(--accent);

  font-size: 0.8rem;
  text-decoration: none;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(53, 255, 154, 0.35);
}

.email:hover {
  text-decoration: underline;
}
    @media (max-width: 520px) {
  .terminal {
    padding: 26px 22px;
  }

  h1 {
    font-size: 1.8rem;
    letter-spacing: 1px;
    line-height: 1.25;
  }

  p {
    font-size: 0.9rem;
    line-height: 1.65;
  }
}
  </style>
</head>

<body>

  <main class="terminal">

    <div class="status">
      <span class="status-dot"></span>
      <span>SYSTEM OFFLINE</span>
    </div>

    <div class="prompt">
      &gt; Estado
    </div>

    <h1>
      SITIO NO DISPONIBLE
    </h1>

<p>
  Este sector de la red está temporalmente no disponible.<span class="cursor"></span>
</p>

<a class="email" href="mailto:contacto@cmd-pro.win">
  contacto@cmd-pro.win
</a>

  </main>
  
</body>

</html>
