<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-label="CMD-PRO terminal icon"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10271d" />
      <stop offset="0.55" stop-color="#08120e" />
      <stop offset="1" stop-color="#030706" />
    </linearGradient>

    <radialGradient id="halo" cx="0.42" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#35ff9a" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#35ff9a" stop-opacity="0.05" />
      <stop offset="1" stop-color="#35ff9a" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path
        d="M48 0H0V48"
        fill="none"
        stroke="#35ff9a"
        stroke-opacity="0.055"
        stroke-width="2"
      />
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#halo)" />
  <rect width="512" height="512" rx="112" fill="url(#grid)" />

  <circle
    cx="256"
    cy="256"
    r="174"
    fill="#07110d"
    fill-opacity="0.82"
    stroke="#35ff9a"
    stroke-opacity="0.78"
    stroke-width="8"
  />
  <circle
    cx="256"
    cy="256"
    r="154"
    fill="none"
    stroke="#c4ffe1"
    stroke-opacity="0.12"
    stroke-width="4"
  />

  <g
    fill="none"
    stroke="#57ffab"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="34"
    filter="url(#glow)"
  >
    <path d="M161 176 L246 246 L161 316" />
    <path d="M291 316 H367" />
  </g>
</svg>
