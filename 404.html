<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>404 — CMD-PRO</title>

  <link rel="stylesheet" href="/style.css?v=3">
</head>

<body>
  <main class="profile-card">

    <div class="avatar" aria-label="404 error">
      404
    </div>

    <p class="status">
      <span class="status-dot"></span>
      Signal lost
    </p>

    <h1>NOT FOUND</h1>

    <p class="username">ERR_404</p>

    <p class="bio">
      Whatever you were looking for isn't here.
      Maybe it never was.
    </p>

    <p class="location">
      ◉ Unknown Sector · The Network
    </p>

    <nav class="links" aria-label="Navigation">
      <a
        class="profile-link"
        href="/"
      >
        <span>Return Home</span>
        <span class="arrow">←</span>
      </a>
    </nav>

    <footer>
      <span>cmd-pro.win</span>
      <span>404</span>
    </footer>

  </main>
</body>
</html>
