<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>404 — CMD-PRO</title>

  <meta name="theme-color" content="#05070a">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">

  <!-- Main site theme -->
  <link rel="stylesheet" href="/style.css?v=5">

  <!-- Stuff/error page layout -->
  <link rel="stylesheet" href="/stuff.css?v=4">

  <!-- Shared terminal avatar -->
  <link rel="stylesheet" href="/avatar.css?v=3">

  <!-- Shared interior page frame -->
  <link rel="stylesheet" href="/interior.css?v=3">
</head>

<body class="error-page">

  <main class="error-screen interior-card interior-card--wide">

    <header class="error-header">

      <a class="error-brand" href="/" aria-label="CMD-PRO home">
        <div
          class="mini-avatar terminal-avatar terminal-avatar--mini"
          aria-hidden="true"
        >
          <svg
            class="terminal-mark"
            viewBox="0 0 64 64"
          >
            <g
              fill="none"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 20 L30 32 L15 44" />
              <path d="M38 44 H55" />
            </g>
          </svg>
        </div>

        <span>CMD-PRO</span>
      </a>

      <div class="error-status">
        <span class="status-dot"></span>
        <span>SIGNAL LOST</span>
      </div>

    </header>


    <section class="error-content">

      <div class="error-number">
        404
      </div>

      <div class="error-info">

        <p class="error-label">
          ERR_STUFF_NOT_FOUND
        </p>

        <h1 class="error-title">
          Nothing here.
        </h1>

        <p class="error-description">
          This sector of the network has not been mapped yet.
        </p>

        <a
          class="error-return"
          href="/"
        >
          <span>Return Home</span>
          <span>←</span>
        </a>

      </div>

    </section>


    <footer class="error-footer">

      <span>
        ◉ Sector 0x00 · Unmapped
      </span>

      <span>
        cmd-pro.win
      </span>

      <span>
        ERR 404
      </span>

    </footer>

  </main>

</body>
</html>
